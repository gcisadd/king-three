<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alert 看板</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(18, 27, 49, .86);
      --panel-strong: #151f38;
      --border: rgba(148, 163, 184, .18);
      --text: #eef4ff;
      --muted: #91a0ba;
      --blue: #6ea8fe;
      --cyan: #52d6d9;
      --orange: #ffb86b;
      --red: #ff7f8d;
      --shadow: 0 18px 48px rgba(0, 0, 0, .22);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 85% -10%, rgba(82, 214, 217, .14), transparent 34rem),
        radial-gradient(circle at -5% 20%, rgba(110, 168, 254, .13), transparent 30rem),
        var(--bg);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 34px 0 56px; }

    .header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 26px; }
    .eyebrow { margin: 0 0 8px; color: var(--cyan); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 46px); line-height: 1.06; letter-spacing: -.04em; }
    .subtitle { max-width: 500px; margin: 12px 0 0; color: var(--muted); }

    .toolbar, .filters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(18, 27, 49, .68);
      box-shadow: var(--shadow);
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    .button {
      min-height: 40px;
      padding: 0 15px;
      border: 1px solid rgba(110, 168, 254, .42);
      border-radius: 10px;
      color: #f7fbff;
      background: rgba(110, 168, 254, .16);
    }
    .button:hover { background: rgba(110, 168, 254, .27); }
    .button.secondary { border-color: var(--border); background: rgba(255, 255, 255, .045); }
    .button:disabled { cursor: not-allowed; opacity: .45; }

    .file-name { min-width: 150px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status { margin-left: auto; color: var(--muted); font-size: 12px; }
    .status.error { color: var(--red); }
    .check { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); white-space: nowrap; }
    .check input { accent-color: var(--cyan); }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0; }
    .stat { min-width: 0; padding: 18px; border: 1px solid var(--border); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); }
    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 25px; font-weight: 650; letter-spacing: -.02em; }
    .stat-value.accent { color: var(--cyan); }

    .filters { margin-bottom: 18px; box-shadow: none; }
    .field { flex: 1 1 190px; min-width: 170px; }
    .field label { display: block; margin: 0 0 5px; color: var(--muted); font-size: 12px; }
    .field input, .field select {
      width: 100%;
      height: 40px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      background: rgba(5, 10, 24, .62);
    }
    .field select option { color: #111827; }

    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 0 12px; }
    .section-head h2 { margin: 0; font-size: 18px; }
    .section-head span { color: var(--muted); font-size: 12px; }

    .groups { display: grid; gap: 12px; }
    .group { overflow: hidden; border: 1px solid var(--border); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); }
    .group-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 18px; border-bottom: 1px solid var(--border); background: linear-gradient(90deg, rgba(110, 168, 254, .1), transparent); }
    .group-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .group-index { color: var(--cyan); font-weight: 700; }
    .group-owner { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .group-meta { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
    .alerts { display: grid; gap: 1px; background: var(--border); }
    .alert-row { display: grid; grid-template-columns: 8px 1fr auto; gap: 12px; align-items: start; padding: 14px 18px; background: rgba(18, 27, 49, .92); }
    .alert-mark { width: 8px; min-height: 32px; border-radius: 8px; background: linear-gradient(var(--orange), var(--red)); }
    .alert-text { min-width: 0; color: var(--text); word-break: break-word; }
    .alert-detail { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .alert-time { color: var(--muted); font-size: 12px; white-space: nowrap; }

    .empty { padding: 54px 20px; border: 1px dashed rgba(148, 163, 184, .34); border-radius: 16px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 5px; color: var(--text); font-size: 16px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 760px) {
      .shell { width: min(100% - 20px, 680px); padding-top: 22px; }
      .header { display: block; }
      .toolbar, .filters { align-items: stretch; }
      .button, .file-name, .status { width: 100%; margin-left: 0; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .group-head { align-items: flex-start; flex-direction: column; gap: 6px; }
      .group-meta { text-align: left; }
      .alert-row { grid-template-columns: 8px 1fr; }
      .alert-time { grid-column: 2; }
    }

    @media (max-width: 420px) {
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <p class="eyebrow">Army task · local monitor</p>
        <h1>Alert 看板</h1>
        <p class="subtitle">只展示最近一次接口获取的告警，快速定位角色、服务器和具体动作。</p>
      </div>
    </header>

    <section class="toolbar" aria-label="日志操作">
      <button class="button" id="refreshButton" type="button">刷新</button>
      <label class="check"><input id="autoRefresh" type="checkbox" checked> 自动刷新</label>
      <span class="file-name" id="fileName">本地看板服务 · alert-logs</span>
      <span class="status" id="status" aria-live="polite">等待加载数据</span>
    </section>

    <section class="stats" aria-label="统计信息">
      <div class="stat"><div class="stat-label">当前结果</div><div class="stat-value tabular" id="groupCount">0</div></div>
      <div class="stat"><div class="stat-label">Alert 总数</div><div class="stat-value accent tabular" id="alertCount">0</div></div>
      <div class="stat"><div class="stat-label">角色 / 服务器</div><div class="stat-value tabular" id="ownerCount">0</div></div>
      <div class="stat"><div class="stat-label">最近获取</div><div class="stat-value" id="latestTime">—</div></div>
    </section>

    <div class="section-head">
      <h2>最新告警</h2>
      <span id="resultSummary">暂无数据</span>
    </div>
    <section class="groups" id="groups" aria-live="polite">
      <div class="empty"><strong>正在连接看板服务</strong>程序启动后会自动读取 alert-logs。</div>
    </section>
  </main>

  <script>
    const state = {
      groups: [],
      timer: null,
      loading: false,
      refreshIntervalMs: 30_000,
    };
    const $ = id => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getAlert(record) {
      return record && Object.prototype.hasOwnProperty.call(record, 'alert')
        ? record.alert
        : record;
    }

    function getDisplay(record) {
      const alert = getAlert(record);
      if (typeof alert === 'string') return alert;
      if (alert && typeof alert.display === 'string') return alert.display;
      try { return JSON.stringify(alert); } catch { return String(alert); }
    }

    function getTime(record) {
      const time = record && (record.time || record.createdAt || record.timestamp);
      const value = time ? new Date(time).getTime() : 0;
      return Number.isFinite(value) ? value : 0;
    }

    function formatTime(value, withSeconds = true) {
      if (!value) return '未知时间';
      return new Intl.DateTimeFormat('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit',
        ...(withSeconds ? { second: '2-digit' } : {})
      }).format(new Date(value));
    }

    function normalize(data) {
      if (!Array.isArray(data)) throw new Error('日志内容必须是 JSON 数组');
      return data
        .map(item => Array.isArray(item) ? item : [item])
        .filter(group => group.length > 0 && group.some(Boolean));
    }

    function groupTime(group) {
      return group.reduce((latest, record) => Math.max(latest, getTime(record)), 0);
    }

    function groupOwner(group) {
      const first = group.find(Boolean) || {};
      const character = first.characterName || '未知角色';
      const server = first.serverName || '未知服务器';
      return `${character} · ${server}`;
    }

    function allRecords() { return state.groups.flat(); }

    function loadOwners() {
      const ownerSelect = $('ownerSelect');

      if (!ownerSelect) return;

      const owners = [...new Set(state.groups.map(groupOwner))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
      ownerSelect.innerHTML = '<option value="">全部</option>' + owners
        .map(owner => `<option value="${escapeHtml(owner)}">${escapeHtml(owner)}</option>`)
        .join('');
    }

    function renderStats() {
      const records = allRecords();
      const owners = new Set(state.groups.map(groupOwner));
      const latest = state.groups.reduce((value, group) => Math.max(value, groupTime(group)), 0);
      $('groupCount').textContent = state.groups.length;
      $('alertCount').textContent = records.length;
      $('ownerCount').textContent = owners.size;
      $('latestTime').textContent = latest ? formatTime(latest, false) : '—';
    }

    function matches(group) {
      const keyword = $('searchInput')?.value.trim().toLowerCase() || '';
      const owner = $('ownerSelect')?.value || '';
      if (owner && groupOwner(group) !== owner) return false;
      if (!keyword) return true;
      return JSON.stringify(group).toLowerCase().includes(keyword);
    }

    function renderGroups() {
      const filtered = state.groups
        .slice()
        .sort((a, b) => groupTime(b) - groupTime(a))
        .filter(matches);
      $('resultSummary').textContent = state.groups.length
        ? `仅显示最新一组 · ${filtered[0]?.length ?? 0} 条 alert`
        : '暂无数据';

      if (!filtered.length) {
        $('groups').innerHTML = `<div class="empty"><strong>${state.groups.length ? '没有匹配的告警' : '暂时没有 alert'}</strong>${state.groups.length ? '请调整筛选条件。' : '程序获取到 alert 后会自动显示在这里。'}</div>`;
        return;
      }

      $('groups').innerHTML = filtered.map(group => {
        const time = groupTime(group);
        const owner = groupOwner(group);
        const rows = group.map(record => {
          const alert = getAlert(record) || {};
          const id = alert && typeof alert === 'object' ? alert.id : '';
          const actionId = alert && typeof alert === 'object' ? alert.actionId : '';
          const detail = [id ? `alert id: ${id}` : '', actionId ? `action id: ${actionId}` : '']
            .filter(Boolean).join(' · ');
          return `<article class="alert-row">
            <span class="alert-mark" aria-hidden="true"></span>
            <div class="alert-text">
              <div>${escapeHtml(getDisplay(record))}</div>
              ${detail ? `<div class="alert-detail">${escapeHtml(detail)}</div>` : ''}
            </div>
            <time class="alert-time" datetime="${escapeHtml(record.time || '')}">${escapeHtml(formatTime(getTime(record)))}</time>
          </article>`;
        }).join('');
        return `<article class="group">
          <header class="group-head">
            <div class="group-title"><span class="group-index">最新</span><span class="group-owner">${escapeHtml(owner)}</span></div>
            <div class="group-meta">${escapeHtml(formatTime(time))} · ${group.length} 条 alert</div>
          </header>
          <div class="alerts">${rows}</div>
        </article>`;
      }).join('');
    }

    function render() {
      renderStats();
      renderGroups();
    }

    function setStatus(message, isError = false) {
      $('status').textContent = message;
      $('status').classList.toggle('error', isError);
    }

    function intervalLabel(milliseconds) {
      const seconds = Math.round(milliseconds / 1000);
      if (seconds % 60 === 0) return `${seconds / 60} 分钟`;
      return `${seconds} 秒`;
    }

    function restartAutoRefresh() {
      clearInterval(state.timer);
      state.timer = $('autoRefresh').checked
        ? setInterval(loadAlerts, state.refreshIntervalMs)
        : null;
    }

    async function loadAlerts() {
      if (state.loading) return;
      state.loading = true;

      try {
        const response = await fetch(
          `/api/alerts?ts=${Date.now()}`,
          { cache: 'no-store' },
        );
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }

        state.groups = normalize(data.groups || []);
        state.refreshIntervalMs = Number(data.refreshIntervalMs) || 30_000;
        $('fileName').textContent = `本地看板服务 · 每 ${intervalLabel(state.refreshIntervalMs)} 刷新`;
        loadOwners();
        render();
        setStatus(`已更新 ${formatTime(Date.now())}`);
        restartAutoRefresh();
      } catch (error) {
        setStatus(`连接看板服务失败：${error.message}`, true);
      } finally {
        state.loading = false;
      }
    }

    $('refreshButton').addEventListener('click', loadAlerts);
    $('searchInput')?.addEventListener('input', renderGroups);
    $('ownerSelect')?.addEventListener('change', renderGroups);
    $('autoRefresh').addEventListener('change', event => {
      restartAutoRefresh();
    });

    loadAlerts();
  </script>
</body>
</html>
